name: Proses inbox docx

on:
  push:
    paths:
      - "inbox/**.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inbox
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang dependency
        run: npm install --no-audit --no-fund

      - name: Konversi setiap job di inbox
        run: |
          shopt -s nullglob
          mkdir -p inbox/failed
          for job in inbox/*.json; do
            docx=$(jq -r '.docx' "$job")
            tier=$(jq -r '.tier' "$job")
            category=$(jq -r '.category' "$job")
            name=$(jq -r '.name' "$job")
            echo "=== $category / $name ($tier)"
            if node scripts/add-package.js "$docx" --tier "$tier" --category "$category" --name "$name"; then
              git rm -q "$job" "$docx"
            else
              echo "GAGAL: $job (lihat log di atas)"
              git mv "$job" inbox/failed/
              git mv "$docx" inbox/failed/
            fi
          done

      - name: Commit hasil
        run: |
          git config user.name "soalin-bot"
          git config user.email "soalin-bot@users.noreply.github.com"
          git add -A packages images index.json inbox
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git commit -m "Konversi paket dari inbox"
          git push origin HEAD:${{ github.ref_name }}
